name: Build Base APK Template

on:
  push:
    branches: [main]
    paths:
      - 'android-client/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: Make gradlew executable
        run: chmod +x android-client/gradlew

      - name: Build unsigned APK
        run: |
          cd android-client
          ./gradlew assembleRelease --no-daemon

      - name: Create config placeholder
        run: |
          echo -n '{"serverUrl":"wss://localhost:10000/ws","deviceId":"template","buildTime":0,"version":"2.0.0","key":"placeholder-key"}' | base64 > /tmp/config.enc

      - name: Create templates directory
        run: mkdir -p server/templates

      - name: Copy and inject config
        run: |
          cp android-client/app/build/outputs/apk/release/app-release-unsigned.apk server/templates/base.apk
          cd server/templates
          cp /tmp/config.enc config.enc
          zip -f base.apk config.enc 2>/dev/null || true

      - name: Upload APK template artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-apk-template
          path: server/templates/base.apk
          retention-days: 90

      - name: Create signed release APK
        if: github.event_name == 'release'
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          
          # Generate temp keystore if none exists
          keytool -genkey -v -keystore /tmp/release.jks \
            -alias wuzenx -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass wuzenx123 -keypass wuzenx123 \
            -dname "CN=WuzenX, OU=Security, O=WuzenCorp, L=Unknown, ST=Unknown, C=US"
          
          # Zipalign
          "$BUILD_TOOLS/zipalign" -p -f 4 server/templates/base.apk /tmp/aligned.apk
          
          # Sign
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/release.jks \
            --ks-pass pass:wuzenx123 --ks-key-alias wuzenx \
            --out WuzenX-release.apk /tmp/aligned.apk
          
          # Upload to release
          gh release upload ${{ github.event.release.tag_name }} WuzenX-release.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
