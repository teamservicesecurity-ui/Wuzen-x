# System & JVM Options
# Fixed: Correct JVM flag (-XX:+UseParallelGC instead of -XX:+ParallelGC)
# Added UTF-8 encoding and daemon optimization flags
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Enable Gradle build caching and parallel execution for faster builds
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX & Kotlin Configuration
android.useAndroidX=true
kotlin.code.style=official

# Non-transitive R classes speed up build times in multi-module projects
android.nonTransitiveRClass=true

# Enables modern Kotlin/Java toolchain and incremental compilation
kotlin.incremental=true

